name: scholarlogic

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholarlogic
      POSTGRES_DB: scholarlogic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Port 5433 avoids clashing with a Postgres already installed on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarlogic -d scholarlogic"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
